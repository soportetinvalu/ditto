name: Build macOS (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      OUTPUT_DIR: ${{ runner.temp }}/memorialocal-${{ github.run_id }}-${{ github.run_attempt }}
      LOG_DIR: ${{ runner.temp }}/memorialocal-logs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified via official GitHub tag API
        with:
          persist-credentials: false
      - name: Record runner and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            uname -m
            xcode-select -p
            swift --version
          } 2>&1 | tee "$LOG_DIR/toolchain.log"
      - name: Test, build and package (ad hoc signing)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/macos_executor.py --output "$OUTPUT_DIR" 2>&1 | tee "$LOG_DIR/package.log"
      - name: Upload app, corresponding source and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified via official GitHub tag API
        with:
          name: MemoriaLocal-arm64-${{ github.sha }}
          path: |
            ${{ env.OUTPUT_DIR }}/MemoriaLocal-arm64.zip
            ${{ env.OUTPUT_DIR }}/MemoriaLocal-source.zip
            ${{ env.OUTPUT_DIR }}/SHA256SUMS.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MemoriaLocal-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.LOG_DIR }}/*.log
            ${{ env.OUTPUT_DIR }}/macos-executor.log
            ${{ env.OUTPUT_DIR }}/result.json
          if-no-files-found: warn
          retention-days: 14
