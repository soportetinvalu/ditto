name: Build macOS (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Standard native arm64 image; avoid the saturated macos-latest pool.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Initialize output paths
        shell: bash
        run: |
          set -euo pipefail
          echo "OUTPUT_DIR=$RUNNER_TEMP/nexclip-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "LOG_DIR=$RUNNER_TEMP/nexclip-logs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "MACOS_CODESIGN_TEMP_DIR=$RUNNER_TEMP/nexclip-sign-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified via official GitHub tag API
        with:
          persist-credentials: false
          fetch-depth: 0 # Immutable baseline for the real presentation comparison.
      - name: Record runner and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            uname -m
            xcode-select -p
            swift --version
          } 2>&1 | tee "$LOG_DIR/toolchain.log"
      - name: Real presentation in LaunchServices application bundles
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_presentation_bundle.py "$LOG_DIR/presentation" 2>&1 | tee "$LOG_DIR/presentation.log"
      - name: Check signing lifecycle (isolated mocks)
        run: python3 scripts/test_sign_macos.py
      - name: History UI regression tests and isolated sensitivity controls
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_history_ui_sensitivity.py "$LOG_DIR/history-ui" 2>&1 | tee "$LOG_DIR/history-ui.log"
      - name: Test, build and package (stable signing, ad hoc without secrets)
        shell: bash
        env:
          NEXCLIP_RUN_FOCUS_TESTS: '1'
          MACOS_CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          MACOS_CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/macos_executor.py --output "$OUTPUT_DIR" 2>&1 | tee "$LOG_DIR/package.log"
      - name: Remove temporary signing keychain (including failures)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MACOS_CODESIGN_TEMP_DIR:-}" && -d "$MACOS_CODESIGN_TEMP_DIR" ]]; then
            if [[ -f "$MACOS_CODESIGN_TEMP_DIR/signing.keychain-db" ]]; then
              security delete-keychain "$MACOS_CODESIGN_TEMP_DIR/signing.keychain-db"
            fi
            rm -rf "$MACOS_CODESIGN_TEMP_DIR"
          fi
          test ! -e "$MACOS_CODESIGN_TEMP_DIR"
          echo 'PASS: no temporary signing identity remains.'
      - name: Upload app, corresponding source, public certificate and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified via official GitHub tag API
        with:
          name: NexClip-arm64-${{ github.sha }}
          path: |
            ${{ env.OUTPUT_DIR }}/NexClip-arm64.zip
            ${{ env.OUTPUT_DIR }}/NexClip-source.zip
            ${{ env.OUTPUT_DIR }}/SHA256SUMS.json
            ${{ env.OUTPUT_DIR }}/NexClip-Developer.cer
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NexClip-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.LOG_DIR }}/*.log
            ${{ env.LOG_DIR }}/presentation/**/*.json
            ${{ env.LOG_DIR }}/presentation/**/*.log
            ${{ env.LOG_DIR }}/history-ui/*.json
            ${{ env.LOG_DIR }}/history-ui/*.log
            ${{ env.OUTPUT_DIR }}/macos-executor.log
            ${{ env.OUTPUT_DIR }}/result.json
            ${{ env.OUTPUT_DIR }}/signature-inspection.json
          if-no-files-found: warn
          retention-days: 14
